<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOSHPIT · Datamosh Studio</title>
    <meta name="description" content="A creative datamoshing studio that runs entirely in your browser." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111'/><rect x='4' y='6' width='10' height='8' fill='%23ff3d8b'/><rect x='12' y='12' width='14' height='6' fill='%2300e5ff'/><rect x='8' y='18' width='16' height='8' fill='%23ffe14d'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;background:#0b0b10;color:#ecebf5;font-family:system-ui,-apple-system,sans-serif">
    <div id="app">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center">
        <div style="font:800 34px ui-monospace,Menlo,monospace;letter-spacing:.05em;text-shadow:3px 0 #ff3d8b,-3px 0 #00e5ff">MOSHPIT</div>
        <div id="boot-msg" style="color:#9a98b3;font-size:14px">Loading the studio…</div>
      </div>
    </div>
    <noscript><p style="padding:16px;text-align:center">MOSHPIT needs JavaScript enabled.</p></noscript>
    <script>
      // Shown before the app loads, so problems are visible even on phones without devtools.
      (function () {
        var shown = false;
        function show(title, detail) {
          if (shown) return;
          shown = true;
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#2a1018;border:1px solid #ff5c5c;color:#ffd9de;border-radius:10px;padding:12px 14px;font:13px/1.45 system-ui,-apple-system,sans-serif;white-space:pre-wrap;max-height:45vh;overflow:auto');
          box.textContent = title + (detail ? '\n\n' + detail : '');
          var close = document.createElement('button');
          close.textContent = 'Dismiss';
          close.setAttribute('style', 'display:block;margin-top:8px;background:#ff3d8b;color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit');
          close.onclick = function () { box.remove(); shown = false; };
          box.appendChild(close);
          (document.body || document.documentElement).appendChild(box);
        }
        window.addEventListener('error', function (e) {
          if (window.__moshpitMounted) return;
          show('MOSHPIT could not start: ' + (e.message || 'script error'), (e.filename || '') + (e.lineno ? ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (window.__moshpitMounted) return;
          show('MOSHPIT could not start: ' + ((e.reason && e.reason.message) || e.reason));
        });
        setTimeout(function () {
          if (window.__moshpitMounted) return;
          var m = document.getElementById('boot-msg');
          if (m) m.innerHTML = 'This is taking unusually long.<br>Try reloading. MOSHPIT needs a recent browser (Safari 15.4+, Chrome, Firefox or Edge).' +
            (location.hostname.endsWith('github.io') ? '<br><br><small>Site owner: if this never loads, set <b>Settings → Pages → Source</b> to <b>GitHub Actions</b>.</small>' : '');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
