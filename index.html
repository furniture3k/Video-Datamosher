<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>moshpit</title>
    <meta name="description" content="A creative datamoshing studio that runs entirely in your browser." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23121214'/><path transform='translate(16 16) scale(0.95) translate(-16 -16)' d='M6 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v14h-4v3h-4v-5h-4v7h-4v-4H6zM13.5 9v7l6-3.5z' fill='%23c8f031' fill-rule='evenodd'/></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0d" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="moshpit" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;background:#0b0b0d;color:#ededee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <div id="app">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center">
        <div style="display:flex;align-items:center;gap:10px;font:750 22px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:-0.03em"><svg width="30" height="32" viewBox="4 3 24 26" aria-hidden="true"><path d="M6 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v14h-4v3h-4v-5h-4v7h-4v-4H6zM13.5 9v7l6-3.5z" fill="#c8f031" fill-rule="evenodd"/></svg>moshpit</div>
        <div id="boot-msg" style="color:#6d6d76;font-size:12px">loading</div>
      </div>
    </div>
    <noscript><p style="padding:16px;text-align:center">MOSHPIT needs JavaScript enabled.</p></noscript>
    <script>
      // Shown before the app loads, so problems are visible even on phones without devtools.
      (function () {
        var shown = false;
        function show(title, detail) {
          if (shown) return;
          shown = true;
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.setAttribute('style', 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#1b1b1f;border:1px solid #323238;border-left:3px solid #ff5d4f;color:#ededee;border-radius:8px;padding:12px 14px;font:13px/1.45 system-ui,-apple-system,sans-serif;white-space:pre-wrap;max-height:45vh;overflow:auto');
          box.textContent = title + (detail ? '\n\n' + detail : '');
          var close = document.createElement('button');
          close.textContent = 'Dismiss';
          close.setAttribute('style', 'display:block;margin-top:8px;background:#25252a;color:#ededee;border:1px solid #323238;border-radius:6px;padding:6px 12px;font:inherit');
          close.onclick = function () { box.remove(); shown = false; };
          box.appendChild(close);
          (document.body || document.documentElement).appendChild(box);
        }
        window.addEventListener('error', function (e) {
          if (window.__moshpitMounted) return;
          show('MOSHPIT could not start: ' + (e.message || 'script error'), (e.filename || '') + (e.lineno ? ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (window.__moshpitMounted) return;
          show('MOSHPIT could not start: ' + ((e.reason && e.reason.message) || e.reason));
        });
        setTimeout(function () {
          if (window.__moshpitMounted) return;
          var m = document.getElementById('boot-msg');
          if (m) m.innerHTML = 'This is taking unusually long.<br>Try reloading. MOSHPIT needs a recent browser (Safari 15.4+, Chrome, Firefox or Edge).' +
            (location.hostname.endsWith('github.io') ? '<br><br><small>Site owner: if this never loads, set <b>Settings → Pages → Source</b> to <b>GitHub Actions</b>.</small>' : '');
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
