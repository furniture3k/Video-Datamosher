name: Desktop app

# Builds the installers (Windows .msi/.exe, macOS .dmg for Apple Silicon and Intel, Linux
# .AppImage/.deb/.rpm). Pushing a tag like v1.2.0, or running it by hand with "release" ticked
# (which tags v<version from package.json>), attaches them to a GitHub Release that is published
# once every build succeeded. Run by hand without "release", it only uploads them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release (creates the tag v<version> from package.json)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ffmpeg:
    # the FFmpeg the installers bundle, built from checked source
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-intel }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
          # the GStreamer plugins the AppImage bundles (bundleMediaFramework): without them it uses the
          # host's, built for another GStreamer, and the page crashes as soon as it plays sound
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-pulseaudio gstreamer1.0-alsa gstreamer1.0-gl
      - run: npm ci
      - name: FFmpeg for ${{ matrix.target }}
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: src-tauri/binaries
      - run: chmod +x src-tauri/binaries/moshpit-ffmpeg-*
        shell: bash
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing (see DESKTOP.md → Signing). Add the secrets, then uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target ${{ matrix.target }}
          # __VERSION__ is the app version; tauri-action creates the tag with the release if needed
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release && 'v__VERSION__' || '') }}
          releaseName: moshpit v__VERSION__
          releaseBody: |
            Desktop builds of moshpit with native FFmpeg.

            - **Windows**: run the `.msi` or `-setup.exe`. If SmartScreen warns about an unknown publisher, choose *More info → Run anyway*.
            - **macOS**: open the `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel) and drag moshpit to Applications. The app isn't notarised yet: the first time, right-click it and choose *Open*.
            - **Linux**: the `.AppImage` runs anywhere (`chmod +x` it first); `.deb` and `.rpm` are also attached.

            Includes a GPL build of FFmpeg, built by this project's own workflow from FFmpeg's signed source release and pinned sources of x264, libvpx, libvorbis and zlib (`scripts/build-ffmpeg.sh`; the exact sources are listed in `FFMPEG-NOTICE.txt` in each install).
          releaseDraft: true
      - uses: actions/upload-artifact@v7
        with:
          name: moshpit-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: error

  android:
    # the Android APK (experimental), attached to the release too
    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    # once every installer built, publish the draft release (a failed build leaves it as a draft)
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moshpit-android
      - run: gh release upload "${TAG:-v$(node -p "require('./package.json').version")}" moshpit-android-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - run: gh release edit "${TAG:-v$(node -p "require('./package.json').version")}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
