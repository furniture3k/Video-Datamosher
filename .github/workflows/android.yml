name: Android app

# The Android app (experimental): the editor in the system webview with the browser's video
# engine, built as an APK. Runs on pull requests that touch the native side, by hand, and from the
# Desktop app workflow when it makes a release (which attaches the APK).
#
# The APK is signed with the key in the ANDROID_KEYSTORE secret (base64 of a .jks, with
# ANDROID_KEYSTORE_PASSWORD) when there is one. Without it, a new self-signed key is made for each
# build: the APK installs, but each new one has to replace the old one by uninstalling first.
on:
  pull_request:
    paths: ['src-tauri/**', 'src/lib/platform.ts', 'src/lib/storage.ts', '.github/workflows/android.yml']
  workflow_dispatch:
  workflow_call:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: Android NDK (the newest one on the runner)
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --ci
      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          apk=$(find src-tauri/gen/android -name '*release*.apk' | head -1)
          echo "built $apk"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            pass=moshpit-self-signed
            keytool -genkeypair -keystore release.jks -storepass "$pass" -keypass "$pass" -alias moshpit -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=moshpit"
          fi
          "$tools/zipalign" -f -p 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$pass" --out moshpit-android-arm64.apk aligned.apk
          "$tools/apksigner" verify moshpit-android-arm64.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: moshpit-android
          path: moshpit-android-arm64.apk
          if-no-files-found: error
