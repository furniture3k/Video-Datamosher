name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (for engine integration tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop:
    # the desktop app (Tauri + native FFmpeg), driven through WebDriver on Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkit2gtk-driver xvfb ffmpeg
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: npm run build
      - run: node scripts/fetch-ffmpeg.mjs --dev
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/e2e-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-screenshots
          path: test-results/desktop
