name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg (for engine integration tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # no serious accessibility problems on the website, the home screen, the editor and its dialogs
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:a11y
      # every window size from the desktop app's smallest to 4K, phones and tablets, every picture shape
      - run: npm run test:screens

  ffmpeg:
    # the FFmpeg the desktop app bundles, built from checked source
    uses: ./.github/workflows/ffmpeg.yml

  desktop:
    # the desktop app (Tauri + native FFmpeg), driven through WebDriver on Linux
    needs: ffmpeg
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev webkit2gtk-driver xvfb xdotool
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: npm run build
      # the same FFmpeg the installers ship (Ubuntu 22.04's own is 4.4, too old)
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-x86_64-unknown-linux-gnu
          path: src-tauri/binaries
      - run: chmod +x src-tauri/binaries/moshpit-ffmpeg-*
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - run: xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/e2e-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-screenshots
          path: test-results/desktop

  desktop-other:
    # the native shell compiles and its tests pass on Windows and macOS too
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: src-tauri/binaries
      - run: chmod +x src-tauri/binaries/moshpit-ffmpeg-*
        shell: bash
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
